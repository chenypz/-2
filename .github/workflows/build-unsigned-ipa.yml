name: Build unsigned GameBoost IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: GameBoostExpo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: GameBoostExpo/ios

      - name: Archive without Apple signing
        run: |
          xcodebuild archive \
            -workspace ios/GameBoost.xcworkspace \
            -scheme GameBoost \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/GameBoost.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/GameBoost.xcarchive/Products/Applications/GameBoost.app" Payload/
          zip -qry GameBoost-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameBoost-unsigned-IPA
          path: GameBoostExpo/GameBoost-unsigned.ipa
